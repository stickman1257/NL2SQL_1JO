# Schema Enricher 설정 (CUDA + MLX 공통)
#
# backend: auto  → Mac(Apple Silicon)+MLX 설치 시 mlx, NVIDIA GPU 시 cuda
#
# 패키지:
#   CUDA 서버: pip install torch transformers accelerate bitsandbytes pyyaml
#   Mac MLX  : pip install mlx mlx-lm pyyaml
#
# 환경별 설정 파일:
#   enricher_config.cuda.yaml  — GPU 서버 고정
#   enricher_config.mlx.yaml   — Mac 고정

model:
  backend: "auto"

  # 공통 경로 (지정 시 아래 path_cuda/path_mlx보다 우선)
  path: ""

  # 백엔드별 기본 모델
  path_cuda: "Qwen/Qwen2.5-3B-Instruct"
  path_mlx: "mlx-community/Qwen2.5-3B-Instruct-4bit"

  # CUDA 전용 옵션 (mlx에서는 무시)
  load_in_4bit: true
  device_map: "auto"
  dtype: "auto"

explorer:
  max_turns: 5
  max_tokens: 256
  temperature: 0.3
  top_p: 0.9

selector:
  top_n: 10
  min_score: 1.5
  dedup_logs: true
  weak_description_threshold: 30
  weak_description_bonus: 0.5

paths:
  kb: "data/schema/ecommerce_kb.json"
  db: "data/samples/ecommerce.sqlite"
  logs: "data/samples/nl2sql_logs.jsonl"
